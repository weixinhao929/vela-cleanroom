[package]
name = "taskbar_common"
version = "0.1.0"
description = "Shared definitions between the Vela host (focus-desk) and the velatap taskbar TAP DLL"
edition = "2021"
publish = false

# P3-1（审计修复）：协议原先用 #[path] 跨目录包含主 crate 的
# src/taskbar/protocol.rs——「本文件禁止引用所在 crate 其他模块」只靠注释
# 自律，主 crate 侧一次顺手改动即破坏 DLL 编译，且 serde 依赖两侧独立声明
# 可漂移。抽成 workspace 共享小 crate 后由编译器保证边界。
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
